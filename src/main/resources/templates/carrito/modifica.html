<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>TechShop - Modificar Cantidad</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"></header>

        <section class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="card-title mb-0">Modificar Cantidad</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/carrito/actualizar}" method="post">
                                <input type="hidden" name="producto.idProducto" th:value="${item.producto.idProducto}" />

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Producto:</label>
                                    <p class="form-control-plaintext" th:text="${item.producto.descripcion}">Producto</p>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Precio Unitario:</label>
                                    <p class="form-control-plaintext" th:text="${'₡' + #numbers.formatDecimal(item.producto.precio, 1, 'POINT', 2, 'COMMA')}">₡0.00</p>
                                </div>

                                <div class="mb-3">
                                    <label for="cantidad" class="form-label fw-bold">Cantidad:</label>
                                    <input type="number" id="cantidad" name="cantidad" 
                                           class="form-control" th:value="${item.cantidad}" min="1" 
                                           th:max="${item.producto.existencias}" required />
                                    <div class="form-text">Disponible en stock: [[${item.producto.existencias}]]</div>
                                </div>

                                <div class="d-flex justify-content-between mt-4">
                                    <a th:href="@{/carrito/listado}" class="btn btn-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-success">Guardar Cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>
    </body>
</html>
