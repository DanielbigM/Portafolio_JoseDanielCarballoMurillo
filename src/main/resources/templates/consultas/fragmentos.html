<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Fragmento Tabs -->
    <section th:fragment="tabs" class="py-3 mb-4">

        <div class="d-flex justify-content-center px-5">

            <ul class="nav nav-underline">

                <!-- Botón de "Todas" -->
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link">
                        Todas
                    </a>
                </li>

                <!-- Botones dinámicos de Categorías -->
                <li th:each="c : ${categorias}" class="nav-item">
                    <a th:href="@{/consultas/{id}(id=${c.idCategoria})}" class="nav-link">
                        <span th:text="${c.descripcion}">
                            Categoría
                        </span>
                    </a>
                </li>

            </ul>

        </div>

    </section>

    <!-- Fragmento Tarjetas -->
    <section th:fragment="tarjetas" class="container py-4">

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">

            <div th:each="p : ${productos}" class="col">

                <div class="card h-100 shadow-sm">

                    <!-- CONTENEDOR DE IMAGEN CORREGIDO -->
                    <div class="d-flex justify-content-center align-items-center bg-light p-3"
                         style="height: 200px;">
                        <img th:src="${p.rutaImagen}" class="img-fluid" style="max-height: 100%; object-fit: contain;" alt="Producto">
                    </div>

                    <div class="card-header bg-white">
                        <h5 class="card-title text-center mb-0"
                            th:text="${p.descripcion}">
                            Producto
                        </h5>
                    </div>

                    <div class="card-body">

                        <p class="card-text text-muted"
                           th:text="${p.detalle}">
                            Detalle
                        </p>

                    </div>

                    <div class="card-footer bg-white">

                        <div class="d-flex justify-content-between align-items-center">

                            <span class="fw-bold text-success"
                                  th:text="${'₡' + #numbers.formatDecimal(p.precio,1,'COMMA',2,'POINT')}">
                                ₡0.00
                            </span>

                            <span th:if="${p.existencias > 0}"
                                  class="badge bg-success"
                                  th:text="${p.existencias + ' disponibles'}">
                                Stock
                            </span>

                            <span th:unless="${p.existencias > 0}"
                                  class="badge bg-danger">
                                Agotado
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>
</html>
