<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title>Fragmentos Usuario</title>
    </head>
    <body>

        <!-- Fragmento para botón / modal de Agregar Usuario -->
        <section th:fragment="agregar" class="py-4 mb-4 bg-light">
            <div class="container">
                <div class="row">
                    <div class="col-md-3">
                        <button type="button" 
                                class="btn btn-primary btn-block" 
                                data-bs-toggle="modal" 
                                data-bs-target="#agregarUsuario">
                            <i class="fas fa-plus"></i> Agregar Usuario
                        </button>
                    </div>
                </div>
            </div>

            <!-- Modal Agregar Usuario -->
            <div id="agregarUsuario" class="modal fade" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-md">
                    <div class="modal-content">
                        <div class="modal-header bg-info text-white">
                            <h5 class="modal-title">Agregar Usuario</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action="@{/usuario/guardar}" th:object="${usuario}"
                              method="POST" class="was-validated" enctype="multipart/form-data">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="username">Username</label>
                                    <input type="text" class="form-control" name="username" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="nombre">Nombre</label>
                                    <input type="text" class="form-control" name="nombre" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="apellidos">Apellidos</label>
                                    <input type="text" class="form-control" name="apellidos" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="correo">Correo</label>
                                    <input type="email" class="form-control" name="correo" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="password">Contraseña</label>
                                    <input type="password" class="form-control" name="password" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="imagen">Imagen</label>
                                    <input class="form-control" type="file" name="imagenFile" onchange="readURL(this);"/>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-primary" type="submit">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Fragmento para la tabla de Listado de Usuarios -->
        <section th:fragment="listado" id="usuarios">
            <div class="container">
                <div class="row">
                    <div class="col-md-9">
                        <div class="card">
                            <div class="card-header">
                                <h4>Listado de Usuarios</h4>
                            </div>
                            <div th:if="${usuarios != null and !usuarios.empty}">
                                <table class="table table-striped table-hover">
                                    <!-- 1. En el <thead> agrega la cabecera -->
                                    <thead class="table-dark">
                                        <tr>
                                            <th>#</th>
                                            <th>Imagen</th> <!-- Nueva columna -->
                                            <th>Username</th>
                                            <th>Nombre</th>
                                            <th>Apellidos</th>
                                            <th>Correo</th>
                                            <th>Estado</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>

                                    <!-- 2. En el <tbody> agrega la celda renderizando la imagen -->
                                    <tbody>
                                        <tr th:each="u, contador : ${usuarios}">
                                            <td>[[${contador.count}]]</td>

                                            <!-- Celda de la imagen -->
                                            <td>
                                                <img th:src="@{${u.rutaImagen}}" 
                                                     alt="Foto de perfil" 
                                                     class="rounded-circle" 
                                                     style="width: 40px; height: 40px; object-fit: cover;"
                                                     onerror="this.src='/images/usuario.png';"/> <!-- Imagen por defecto si no encuentra la ruta -->
                                            </td>

                                            <td>[[${u.username}]]</td>
                                            <td>[[${u.nombre}]]</td>
                                            <td>[[${u.apellidos}]]</td>
                                            <td>[[${u.correo}]]</td>
                                            <td>
                                                <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                                                <span th:unless="${u.activo}" class="badge bg-danger">Inactivo</span>
                                            </td>
                                            <td>
                                                <a th:href="@{/usuario/modificar/} + ${u.idUsuario}" class="btn btn-warning btn-sm">
                                                    <i class="fas fa-pencil"></i> Editar
                                                </a>
                                                <form th:action="@{/usuario/eliminar}" method="POST" style="display:inline;">
                                                    <input type="hidden" name="idUsuario" th:value="${u.idUsuario}"/>
                                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">
                                                        <i class="fas fa-trash"></i> Eliminar
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="text-center p-2" th:if="${usuarios == null or usuarios.empty}">
                                <span>No hay usuarios registrados</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center bg-success text-white mb-3">
                            <div class="card-body">
                                <h3>Total Usuarios</h3>
                                <h4 class="fs-2"><i class="fas fa-users"></i> [[${totalUsuarios}]]</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </body>
</html>
