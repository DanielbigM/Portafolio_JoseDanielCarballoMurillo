spring.application.name=JoseDaniel

server.port=80

logging.pattern.dateformat=hh:mm 

spring.main.banner-mode=off

spring.thymeleaf.cache=false


#Conexión a la BD techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop
spring.datasource.username=root
spring.datasource.password=techshop

#Driver y dialecto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Mostrar SQL en el log (útil para debug)
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE